<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FastRead</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <div class="transport">
      <button id="prev" class="icon" title="Previous sentence (←)" aria-label="Previous sentence">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="play" class="icon primary" title="Play / pause (Space)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button id="next" class="icon" title="Next sentence (→)" aria-label="Next sentence">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="speed">
      <button id="slower" class="icon small" title="Slower (-)" aria-label="Slower">
        <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
      </button>
      <input id="rate" type="range" min="0" max="13" step="1" aria-label="Speed">
      <button id="faster" class="icon small" title="Faster (+)" aria-label="Faster">
        <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
      <output id="rateLabel" for="rate" title="Same scale as Chrome's Reading mode"></output>
    </div>

    <div class="tools">
      <button id="pick" class="icon" title="Click on the page to choose where to start" aria-label="Pick start point">
        <svg viewBox="0 0 24 24"><path d="M11 2h2v3.07A7 7 0 0 1 18.93 11H22v2h-3.07A7 7 0 0 1 13 18.93V22h-2v-3.07A7 7 0 0 1 5.07 13H2v-2h3.07A7 7 0 0 1 11 5.07zm1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
      </button>
      <button id="reload" class="icon" title="Re-grab page text" aria-label="Re-grab page text">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
      </button>
      <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <section id="settings" class="settings" hidden>
    <label>Voice
      <select id="voice"></select>
    </label>
    <label>Text size
      <input id="fontSize" type="range" min="13" max="26" step="1">
    </label>
    <label>Theme
      <select id="theme">
        <option value="auto">Match system</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <p class="hint">Speeds use the same scale as Chrome's Reading mode, so 2× here sounds like 2× there. With Windows voices (Microsoft David, Zira, Mark) the top speed, 10×, is about 3 times normal talking speed. Online voices may not speed up past 2×.</p>
  </section>

  <div id="stale" class="notice" hidden>
    Page changed. <button id="staleLoad" class="link">Load new page</button>
  </div>
  <div id="status" class="status" role="status"></div>

  <main id="doc" class="doc" tabindex="-1"></main>

  <footer class="foot">
    <span id="method"></span>
    <span id="progress"></span>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
